<!DOCTYPE html>
<html lang="vi">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1E46C8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="QLCV Hoàng Mai">
<title>QLCV Hoàng Mai</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231E46C8'/%3E%3Crect x='20' y='14' width='24' height='38' rx='4' fill='none' stroke='white' stroke-width='4'/%3E%3Cpath d='M27 26h10M27 34h10M27 42h6' stroke='white' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Bố cục: thanh menu cobalt bên trái (máy tính) / thanh dưới đáy (điện thoại) + vùng làm việc nền trắng sương, thẻ bo tròn */
:root{
  --bg:#F3F6FD; --surface:#fff; --ink:#0D1733; --muted:#5A6A86;
  --s50:#F3F6FD; --s100:#EAEFF9; --s200:#DCE3F2; --s300:#C3CDE2; --s400:#8E9BB5; --s600:#4A5873; --s700:#33405C; --s800:#1E2944;
  --n50:#E3EBFB; --n700:#1A42B8; --n800:#0F2F9E; --n950:#0D1733;
  --i50:#EEF3FE; --i100:#E3EBFB; --i200:#C7D6F8; --i300:#9DB7F3; --i400:#6A8FEC; --i500:#3D6EEF; --i600:#2354E0; --i700:#1A42B8;
  --cam:#F26A2E; --cam400:#F5874F; --cam50:#FEF0E9; --cam700:#B4441A;
  --r50:#FFF1F2; --r200:#FECDD3; --r500:#F43F5E; --r600:#E11D48; --r700:#BE123C;
  --a50:#FFFBEB; --a200:#FDE68A; --a400:#FBBF24; --a500:#F59E0B; --a700:#B45309; --a800:#92400E;
  --e50:#ECFDF5; --e500:#10B981; --e600:#059669; --e700:#047857;
  --v50:#F5F3FF; --v700:#6D28D9;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
[hidden]{display:none!important}
h1,h2,h3{text-wrap:balance;margin:0}
.tab{font-variant-numeric:tabular-nums}
.ic{flex-shrink:0;display:inline-block;vertical-align:middle}
.cobalt{background:radial-gradient(120% 60% at 0% 0%,rgba(255,255,255,.14),rgba(255,255,255,0) 55%),linear-gradient(135deg,#2F62E6 0%,#0D2A8A 100%)}
.thin::-webkit-scrollbar{height:8px;width:8px}
.thin::-webkit-scrollbar-thumb{background:var(--s300);border-radius:99px}
.thin::-webkit-scrollbar-track{background:transparent}
@keyframes pop{from{transform:translateY(8px) scale(.985);opacity:.4}to{transform:none;opacity:1}}
@keyframes slideIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Khung ---- */
.shell{display:flex;min-height:100%}
.side{position:sticky;top:0;height:100vh;width:248px;flex-shrink:0;display:none;flex-direction:column;padding:28px 16px 20px;color:#fff}
@media (min-width:1024px){.side{display:flex}}
.logo{display:flex;align-items:center;gap:10px;padding:0 6px;color:#fff}
.logo .tile{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--n800);display:grid;place-items:center;box-shadow:0 4px 14px rgba(13,23,51,.22)}
.logo .nm{font-size:17px;letter-spacing:-.01em;line-height:1.1;white-space:nowrap}
.logo .nm b{font-weight:700}
.logo .nm span{font-weight:400;opacity:.9}
.logo.sm .tile{width:32px;height:32px;border-radius:10px}
.logo.sm .nm{font-size:16px}
.snav{margin-top:32px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.snav .grp{padding:16px 12px 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.45)}
.snav button{position:relative;display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:rgba(255,255,255,.72);font-family:inherit;font-size:14px;font-weight:500;padding:10px 12px;border-radius:12px;cursor:pointer;text-align:left;transition:background .15s,color .15s}
.snav button:hover{background:rgba(255,255,255,.08);color:#fff}
.snav button.on{background:rgba(255,255,255,.14);color:#fff}
.snav button.on::before{content:"";position:absolute;left:-16px;top:8px;bottom:8px;width:4px;border-radius:0 4px 4px 0;background:var(--cam)}
.snav button.on .ic{color:var(--cam400)}
.snav button span.l{flex:1}
.nbadge{border-radius:99px;background:var(--r500);color:#fff;padding:0 6px;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.sfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.ubox{display:flex;align-items:center;gap:10px;border-radius:12px;background:rgba(255,255,255,.06);padding:10px}
.ubox .who{min-width:0;flex:1}
.ubox .who small{display:block;font-size:11px;color:rgba(255,255,255,.6)}
.ubox .who b{display:block;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ubtn{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:rgba(255,255,255,.75);cursor:pointer}
.ubtn:hover{background:rgba(255,255,255,.12);color:#fff}
.mainwrap{display:flex;flex-direction:column;flex:1;min-width:0}
.mbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:1024px){.mbar{display:none}}
.mbar .r{display:flex;gap:4px}
main{flex:1;padding:24px max(16px,env(safe-area-inset-right,0px)) 112px max(16px,env(safe-area-inset-left,0px))}
@media (min-width:1024px){main{padding:32px 32px 40px}}
.container{max-width:1400px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.phead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.phead h1{font-size:22px;font-weight:600;letter-spacing:-.015em;color:var(--n950)}
@media (min-width:640px){.phead h1{font-size:26px}}
.phead p{margin:2px 0 0;font-size:13px;color:var(--s600)}
.pact{display:flex;flex-wrap:wrap;gap:8px}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:#fff;border-top:1px solid var(--s200);padding:6px max(6px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));box-shadow:0 -4px 16px rgba(13,23,51,.06)}
@media (min-width:1024px){.bnav{display:none}}
/* Điện thoại: trang app nằm lồng trong khung của Google nên cho nội dung một khung cuộn riêng để lướt mượt */
@media (max-width:1023px){
  html,body{height:100%;overflow:hidden}
  #app.shell{height:100%}
  .mainwrap,#login{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .ov{backdrop-filter:none}
}
button,a,input,select,textarea,label,[data-act]{touch-action:manipulation}
.bnav button{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;font-family:inherit;font-size:10.5px;font-weight:500;color:var(--s400);padding:6px 2px;border-radius:10px;cursor:pointer}
.bnav button.on{color:var(--n800);background:var(--i50)}
.bnav .nbadge{position:absolute;top:2px;left:calc(50% + 6px)}

/* ---- Thành phần ---- */
.card{background:#fff;border-radius:16px;box-shadow:0 0 0 1px rgba(220,227,242,.8),0 1px 2px rgba(13,23,51,.04)}
.cpad{padding:20px}
.stitle{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px}
.stitle .l{display:flex;align-items:flex-start;gap:12px;min-width:0}
.stitle .itile{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--n50);color:var(--n700);flex-shrink:0}
.stitle h2{font-size:15px;font-weight:600;color:#0D1733}
.stitle p{margin:2px 0 0;font-size:13px;color:var(--s600)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:0;font-family:inherit;font-size:14px;font-weight:500;white-space:nowrap;cursor:pointer;text-decoration:none;transition:background .15s,box-shadow .15s}
.btn.sm{height:32px;padding:0 12px;font-size:13px;gap:6px}
.btn.xs{height:28px;padding:0 10px;font-size:12px;gap:4px}
.btn.primary{background:var(--n800);color:#fff;box-shadow:0 1px 2px rgba(13,23,51,.1)}
.btn.primary:hover{background:var(--n700)}
.btn.accent{background:var(--i600);color:#fff;box-shadow:0 2px 6px rgba(35,84,224,.22)}
.btn.accent:hover{background:var(--i500)}
.btn.secondary{background:#fff;color:var(--s700);box-shadow:inset 0 0 0 1px var(--s200)}
.btn.secondary:hover{background:var(--s50);box-shadow:inset 0 0 0 1px var(--s300)}
.btn.ghost{background:none;color:var(--s600)}
.btn.ghost:hover{background:var(--s100)}
.btn.soft{background:var(--i50);color:var(--i700)}
.btn.soft:hover{background:var(--i100)}
.btn.danger{background:var(--r600);color:#fff}
.btn.danger:hover{background:var(--r500)}
.btn.dghost{background:none;color:var(--r600)}
.btn.dghost:hover{background:var(--r50)}
.btn:disabled{opacity:.5;cursor:wait}
.ibtn{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;background:none;color:var(--s400);cursor:pointer}
.ibtn:hover{background:var(--s100);color:var(--s800)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--i400);outline-offset:1px}
.inp,select.inp,textarea.inp{width:100%;height:40px;border-radius:12px;border:1px solid var(--s200);background:#fff;color:var(--ink);font-family:inherit;font-size:14px;padding:0 12px;transition:border-color .15s,box-shadow .15s}
select.inp{padding-right:28px}
textarea.inp{height:auto;min-height:84px;padding:10px 12px;line-height:1.5;resize:vertical}
.inp:focus{outline:none;border-color:var(--i400);box-shadow:0 0 0 3px var(--i100)}
.inp::placeholder{color:var(--s400)}
.inp:disabled{background:var(--s50);color:var(--s400)}
input[type=date].inp,input[type=time].inp{min-height:40px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;font-weight:500;color:var(--s600)}
.hint{font-size:12px;color:var(--s400)}
.form{display:flex;flex-direction:column;gap:16px}
.grid2{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--s700);cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--i600)}
.search{position:relative;width:100%}
@media (min-width:640px){.search{width:256px}}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--s400);pointer-events:none}
.search .inp{padding-left:36px}
.seg{display:inline-flex;max-width:100%;overflow-x:auto;border-radius:12px;background:var(--s100);padding:4px}
.seg button{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border:0;border-radius:8px;background:none;color:var(--s600);font-family:inherit;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer}
.seg button.on{background:#fff;color:var(--n800);box-shadow:0 1px 2px rgba(13,23,51,.08)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.toolbar .inp{width:auto;min-width:0}
.toolbar select.inp{width:calc(50% - 5px)}
@media (min-width:640px){.toolbar select.inp{width:auto;min-width:170px}}
.toolbar .end{margin-left:auto;font-size:13px;color:var(--s600)}
.toolbar .search.grow{flex:1 1 260px;width:auto}
.toolbar .search .inp{width:100%}
.drange{display:inline-flex;align-items:center;gap:6px;flex-wrap:nowrap}
.drange .inp{width:150px}
@media (max-width:639px){.drange{width:100%}.drange .inp{flex:1;width:auto}}
.tgl{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 12px;border-radius:12px;border:0;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;background:#fff;color:var(--s600);box-shadow:inset 0 0 0 1px var(--s200)}
.tgl.warn{background:var(--r50);color:var(--r700);box-shadow:inset 0 0 0 1px var(--r200)}
.tgl.on{background:var(--r600);color:#fff;box-shadow:none}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:500;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:99px;display:inline-block;flex-shrink:0}
.k-once{background:var(--s100);color:var(--s600)}
.k-result{background:var(--i50);color:var(--i700)}
.k-stage{background:var(--v50);color:var(--v700)}
.st{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:600;white-space:nowrap}
.st.over{background:var(--r50);color:var(--r700)}
.st.soon,.st.late{background:var(--a50);color:var(--a700)}
.st.doing{background:var(--i50);color:var(--i700)}
.st.done,.st.ontime,.st.early{background:var(--e50);color:var(--e700)}
.st.mute{background:var(--s100);color:var(--s600)}
.due{display:inline-flex;align-items:center;gap:4px;border-radius:6px;padding:2px 6px;font-size:11px;font-weight:500;color:var(--s600);white-space:nowrap}
.due.d-over{background:var(--r50);color:var(--r700);font-weight:600}
.due.d-today{background:var(--a50);color:var(--a700)}
.due.d-soon{color:var(--a700)}
.due.d-ok{color:var(--e600);padding:0}
.due.d-late{color:var(--r600);padding:0}
.bar{width:100%;height:6px;border-radius:99px;background:var(--s100);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--i500);transition:width .3s}
.bar i.full{background:var(--e500)}
.av{display:inline-grid;place-items:center;flex-shrink:0;border-radius:99px;color:#fff;font-weight:600;line-height:1}
.av.sq{border-radius:7px;letter-spacing:-.02em}
.avs{display:flex;align-items:center}
.avs .av{box-shadow:0 0 0 2px #fff}
.avs .av+.av{margin-left:-6px}
.more{font-size:11px;color:var(--s600);margin-left:4px}
.note{display:flex;align-items:center;gap:10px;border-radius:12px;padding:12px 16px;font-size:13px}
.note.amber{background:var(--a50);color:var(--a800)}
.note.blue{background:var(--i50);color:var(--i700)}
.err{border-radius:12px;background:var(--r50);color:var(--r700);padding:10px 12px;font-size:13px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-radius:16px;border:1px dashed var(--s300);background:rgba(255,255,255,.6);padding:40px 24px;text-align:center}
.empty .et{display:grid;place-items:center;width:44px;height:44px;border-radius:16px;background:var(--s100);color:var(--s600)}
.empty b{font-size:14px;color:var(--s800)}
.empty p{margin:0;max-width:380px;font-size:13px;color:var(--s600)}
.muted{color:var(--s600)} .faint{color:var(--s400)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.between{justify-content:space-between}

/* ---- Bảng ---- */
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t thead tr{background:rgba(243,246,253,.7);border-bottom:1px solid var(--s100)}
table.t th{padding:12px;text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--s600);white-space:nowrap}
table.t th:first-child,table.t td:first-child{padding-left:16px}
table.t td{padding:12px;border-bottom:1px solid var(--s100);vertical-align:top}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr.hov:hover td{background:rgba(238,243,254,.5);cursor:pointer}
table.t tr.redrow td{background:rgba(255,241,242,.45)}
table.t td.num,table.t th.num{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.total td{font-weight:700;background:var(--s50)}
.tname{font-weight:500;color:var(--ink)}
.tsub{font-size:12px;color:var(--s400);margin-top:2px}

/* ---- Kanban ---- */
.board{display:flex;gap:16px;overflow-x:auto;padding-bottom:16px;margin:0 -16px;padding-left:16px;padding-right:16px}
@media (min-width:1024px){.board{margin:0;padding-left:0;padding-right:0}}
.col{width:280px;flex-shrink:0;display:flex;flex-direction:column;border-radius:16px;background:rgba(234,239,249,.8);padding:10px}
@media (min-width:640px){.col{width:300px}}
@media (min-width:1100px){.col{width:auto;flex:1 1 0;min-width:220px}}
.colh{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.colh b{font-size:13px;font-weight:600;color:var(--s800)}
.colh .n{border-radius:99px;background:#fff;padding:0 8px;font-size:11px;font-weight:600;color:var(--s600);box-shadow:0 0 0 1px var(--s200)}
.colb{display:flex;flex-direction:column;gap:10px;min-height:80px;flex:1}
.colempty{display:grid;place-items:center;flex:1;border-radius:12px;border:1px dashed var(--s300);padding:24px 0;font-size:12px;color:var(--s400)}
.tcard{background:#fff;border-radius:16px;padding:14px;cursor:pointer;box-shadow:0 0 0 1px rgba(220,227,242,.8),0 1px 2px rgba(13,23,51,.05);transition:box-shadow .15s}
.tcard:hover{box-shadow:0 0 0 1px var(--i300),0 6px 16px rgba(13,23,51,.08)}
.tcard.over{box-shadow:0 0 0 1px var(--r200),0 1px 2px rgba(13,23,51,.05)}
.tcard.over:hover{box-shadow:0 0 0 1px #FDA4AF,0 6px 16px rgba(13,23,51,.08)}
.tc-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.tc-src{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--s400)}
.tc-title{font-size:14px;font-weight:500;line-height:1.35;color:var(--s800);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tcard.done .tc-title{color:var(--s600);text-decoration:line-through;text-decoration-color:var(--s300)}
.tc-prog{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;font-weight:600;color:var(--s600)}
.tc-bot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.tc-bot .l{display:flex;align-items:center;gap:6px;min-width:0}
.tc-bot .l span.nm{font-size:12px;color:var(--s600);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tc-bot .r{display:flex;align-items:center;gap:8px;flex-shrink:0;font-size:11px;color:var(--s400)}

/* ---- Tổng quan ---- */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:900px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.kpi{display:flex;flex-direction:column;gap:10px;padding:16px;text-align:left;border:0;font-family:inherit;cursor:pointer}
.kpi .top{display:flex;align-items:center;justify-content:space-between}
.kpi .itile{display:grid;place-items:center;width:36px;height:36px;border-radius:12px}
.kpi b{font-size:28px;font-weight:600;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--n950)}
.kpi span.lb{font-size:13px;color:var(--s600)}
.kpi:hover{box-shadow:0 0 0 1px var(--i300),0 6px 16px rgba(13,23,51,.08)}
.cols2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1100px){.cols2{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}}
.lst{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--s100)}
.li:first-child{border-top:0}
.li .m{min-width:0;flex:1}

<script>
/* ================= Biểu tượng (nét vẽ kiểu Lucide) ================= */
const IC={
  dashboard:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
  kanban:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 7v7M12 7v4M16 7v9"/>',
  list:'<path d="M3 6h.01M3 12h.01M3 18h.01M8 6h13M8 12h13M8 18h13"/>',

  megaphone:'<path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/>',
  copy:'<rect x="8" y="8" width="14" height="14" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>',
  pencil:'<path d="M21.17 6.81a1 1 0 0 0-3.99-3.99L3.84 16.17a2 2 0 0 0-.5.83l-1.32 4.35a.5.5 0 0 0 .62.62l4.35-1.32a2 2 0 0 0 .83-.5z"/>',
  trash:'<path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  download:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/>',
  check:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
  alert:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  msg:'<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',
  file:'<path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4M16 13H8M16 17H8M10 9H8"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  clip:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>',
  pin:'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  listcheck:'<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
  layers:'<path d="m12 2 10 5-10 5L2 7z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>',
  user:'<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  history:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/>'
};
function ic(n,s,cls){ s=s||16; return '<svg class="ic '+(cls||'')+'" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(IC[n]||'')+'</svg>'; }

/* ================= Dữ liệu ================= */
let TOKEN=null, ME=null, TEAMS=[], PEOPLE=[], TASKS=[], MEETS=[], TODAY='', ACCS=[];
const LD={id:'LD',name:'Lãnh đạo phường'};
const KIND={once:'Giao là xong',result:'Cập nhật khi đến hạn',stage:'Theo giai đoạn'};
const KHINT={once:'Chỉ ghi lại là đã giao, không cần phản hồi.',result:'Đến hạn ghi kết quả là xong.',stage:'Chia nhiều giai đoạn, mỗi giai đoạn có hạn và ghi nhận riêng.'};
const ROLES=['Phó phường','Tổ trưởng','Tổ phó','Cán bộ'];
function setData(d){ ME=d.user; TEAMS=d.teams; PEOPLE=d.people; TASKS=d.tasks; MEETS=d.meets; TODAY=d.today; }

/* ================= Gọi máy chủ ================= */
/* Khi đặt trang này trên GitHub: dán link ứng dụng web (…/exec) vào giữa hai dấu nháy dưới đây. Chạy trong Google thì không cần. */
const API_URL = 'https://script.google.com/macros/s/AKfycbzl54OnACWeGOW5CeC8Qc2LikcC5nFusYJiCynC6dwKioxVF2t66CDjPoOTX_VHHT4f/exec';
const IN_GAS = !!(window.google && google.script && google.script.run);
function api(fn){ const args=[].slice.call(arguments,1);
  if(IN_GAS) return new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(rej)[fn].apply(null,args));
  if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(API_URL)) return Promise.reject(new Error('Trang chưa được gắn link máy chủ (API_URL trong file index.html).'));
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(r=>{ if(!r.ok) throw new Error('Máy chủ không phản hồi (mã '+r.status+'). Thử lại sau.'); return r.json(); },
          ()=>{ throw new Error('Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.'); })
    .then(j=>{ if(!j||!j.ok) throw new Error((j&&j.error)||'Lỗi không rõ.'); return j.data; }); }
const store={
  get(){ try{ return localStorage.getItem('qlcv_tok')||sessionStorage.getItem('qlcv_tok'); }catch(e){ return null; } },
  set(t,rem){ try{ (rem?localStorage:sessionStorage).setItem('qlcv_tok',t); }catch(e){} },
  clear(){ try{ localStorage.removeItem('qlcv_tok'); sessionStorage.removeItem('qlcv_tok'); }catch(e){} }
};
const pref={ get(k,d){ try{ return localStorage.getItem('qlcv_'+k)||d; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('qlcv_'+k,v); }catch(e){} } };
function errMsg(e){ const m=(e&&e.message)||String(e); return m.replace(/^Error:\s*/,''); }
function expired(e){ return /PHIEN_HET_HAN/.test(errMsg(e)); }
let BUSY=false;
async function act(fn,args,okMsg,after){
  if(BUSY) return; BUSY=true; const busy=toast('Đang lưu…','info',0);
  try{ const d=await api.apply(null,[fn,TOKEN].concat(args)); setData(d); applyUser(); dropToast(busy); toast(okMsg||'Đã lưu.'); renderNav(); if(after) after(); else renderPage(); }
  catch(e){ dropToast(busy); if(expired(e)) return showLogin('Phiên đăng nhập đã hết, vui lòng đăng nhập lại.'); toast(errMsg(e),'error',6000); }
  finally{ BUSY=false; }
}

/* ================= Tiện ích ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>d?d.slice(8,10)+'/'+d.slice(5,7):'';
const fmtY=d=>d?d.slice(8,10)+'/'+d.slice(5,7)+'/'+d.slice(0,4):'';
const days=(a,b)=>Math.round((Date.parse(a)-Date.parse(b))/864e5);
const addDays=(d,n)=>new Date(Date.parse(d)+n*864e5).toISOString().slice(0,10);
const WD=['CN','T2','T3','T4','T5','T6','T7'], WDL=['Chủ nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

function curStage(t){ return t.kind==='stage'?t.stages.find(s=>!s.done):null; }
function curDue(t){ const s=curStage(t); return s&&s.due?s.due:t.due; }
function rowState(t,a){ if(a.done) return t.kind==='once'||a.done===t.due?'ontime':a.done<t.due?'early':'late'; return curDue(t)<TODAY?'over':'doing'; }
function taskState(t){ if(t.who.length&&t.who.every(a=>a.done)) return 'done'; const n=days(curDue(t),TODAY); return n<0?'over':n<=3?'soon':'doing'; }
const STXT={over:'Quá hạn',soon:'Sắp đến hạn',doing:'Đang làm',done:'Hoàn thành'};
function stBadge(t){ const s=taskState(t), n=days(curDue(t),TODAY);
  const txt=s==='done'?'Hoàn thành':s==='over'?'Quá hạn '+(-n)+' ngày':s==='soon'?(n===0?'Hạn hôm nay':'Còn '+n+' ngày'):'Đang làm';
  return '<span class="st '+s+'">'+txt+'</span>'; }
function dueBadge(t){
  if(taskState(t)==='done'){ const late=t.kind!=='once'&&t.who.some(a=>a.done&&a.done>t.due); return '<span class="due '+(late?'d-late':'d-ok')+'">'+ic('check',12)+(late?'Xong trễ':'Xong')+' · '+fmt(t.due)+'</span>'; }
  const cd=curDue(t), n=days(cd,TODAY);
  if(n<0) return '<span class="due d-over">'+ic('alert',12)+'Quá hạn '+(-n)+' ngày</span>';
  return '<span class="due '+(n===0?'d-today':n<=2?'d-soon':'')+'">'+ic('calendar',12)+(n===0?'Hôm nay':n===1?'Ngày mai':fmt(cd))+'</span>';
}
const kindChip=t=>'<span class="chip k-'+t.kind+'">'+KIND[t.kind]+'</span>';
function prog(t){ const st=t.kind==='stage'&&t.stages.length; const tot=st?t.stages.length:t.who.length, d=st?t.stages.filter(s=>s.done).length:t.who.filter(a=>a.done).length; return {d:d,tot:tot,pct:tot?d/tot*100:0}; }
const bar=p=>'<div class="bar"><i class="'+(p>=100?'full':'')+'" style="width:'+Math.min(100,Math.max(0,p))+'%"></i></div>';
const ROWTXT={early:'Xong trước hạn',ontime:'Xong đúng hạn',late:'Xong trễ hạn',over:'Quá hạn',doing:'Đang làm'};
const whoShort=t=>t.who.map(aName).join(', ');
const reminds=(t,a)=>t.log.filter(l=>l[2]&&l[2].includes(aKey(a))).length;
function noteText(t,a){
  const key=aKey(a), rev=t.log.slice().reverse();
  const mine=rev.find(l=>l[3]===key||(l[2]&&l[2].includes(key))), gen=rev.find(l=>!l[3]&&!l[2]);
  return mine?fmt(mine[0])+': '+mine[1]:gen?fmt(gen[0])+': '+gen[1]+' (ghi chú chung của việc)':'';
}
function resultTxt(t,a){
  if(t.kind==='once') return ['ontime','Đã giao xong'];
  if(a.done){const n=days(a.done,t.due);return n<0?['early','Xong trước hạn '+(-n)+' ngày']:n===0?['ontime','Xong đúng hạn']:['late','Xong trễ hạn '+n+' ngày'];}
  const n=days(curDue(t),TODAY);return n<0?['over','Chưa xong, quá hạn '+(-n)+' ngày']:['doing','Chưa xong, còn '+n+' ngày'];
}
function progTxt(t,a){
  if(t.kind==='once') return 'Giao là xong';
  if(t.kind==='stage'){const k=t.stages.filter(s=>s.done).length,st=curStage(t);return 'Xong '+k+'/'+t.stages.length+' giai đoạn'+(st?'. Đang làm: '+st.name+' (hạn '+fmt(st.due)+')':'');}

}

/* ---- Khoảng thời gian (dùng chung cho Công việc và Báo cáo) ---- */
const PERIODS=[['all','Mọi thời gian'],['week','Tuần này'],['month','Tháng này'],['lastmonth','Tháng trước'],['quarter','Quý này'],['year','Năm nay'],['custom','Tự chọn ngày…']];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function perRange(P){ const t=new Date(TODAY+'T00:00:00'), y=t.getFullYear(), m=t.getMonth();
  if(P.p==='week'){ const s=new Date(t); s.setDate(t.getDate()-((t.getDay()+6)%7)); const e=new Date(s); e.setDate(s.getDate()+6); return [ymd(s),ymd(e)]; }
  if(P.p==='month') return [ymd(new Date(y,m,1)),ymd(new Date(y,m+1,0))];
  if(P.p==='lastmonth') return [ymd(new Date(y,m-1,1)),ymd(new Date(y,m,0))];
  if(P.p==='quarter'){ const q=Math.floor(m/3)*3; return [ymd(new Date(y,q,1)),ymd(new Date(y,q+3,0))]; }
  if(P.p==='year') return [y+'-01-01',y+'-12-31'];
  if(P.p==='custom'){ let a=P.from||'', b=P.to||''; if(a&&b&&a>b){ const x=a; a=b; b=x; } return [a,b]; }
  return ['',''];
}
function inPer(t,P){ const r=perRange(P); if(!r[0]&&!r[1]) return true; const d=P.b==='due'?t.due:t.assigned; return !!d&&(!r[0]||d>=r[0])&&(!r[1]||d<=r[1]); }
function perLabel(P){ const r=perRange(P), by=P.b==='due'?' (theo hạn)':' (theo ngày giao)';
  if(!r[0]&&!r[1]) return 'mọi thời gian';
  return (r[0]&&r[1]?'từ '+fmtY(r[0])+' đến '+fmtY(r[1]):r[0]?'từ '+fmtY(r[0])+' trở đi':'đến '+fmtY(r[1]))+by; }
function perCtl(id,P){
  return '<select class="inp" id="'+id+'p" aria-label="Khoảng thời gian">'+PERIODS.map(x=>opt(x[0],x[1],P.p)).join('')+'</select>'+
    (P.p==='all'?'':'<select class="inp" id="'+id+'b" aria-label="Tính theo ngày nào">'+opt('assigned','Tính theo ngày giao',P.b)+opt('due','Tính theo hạn',P.b)+'</select>')+
    (P.p==='custom'?'<span class="drange"><input type="date" class="inp" id="'+id+'f" value="'+esc(P.from||'')+'" aria-label="Từ ngày"><span class="muted">đến</span><input type="date" class="inp" id="'+id+'t" value="'+esc(P.to||'')+'" aria-label="Đến ngày"></span>':''); }
function setPer(P,k,v){ if(k==='p'){ P.p=v; if(v==='custom'&&!P.from&&!P.to){ const r=perRange({p:'month'}); P.from=r[0]; P.to=r[1]; } } else if(k==='b') P.b=v; else if(k==='f') P.from=v; else if(k==='t') P.to=v; }
/* Ô chọn tổ / người (dùng chung) */
function whoSel(id,cur,allLabel,label){
  const ppl=PEOPLE.slice().sort((a,b)=>(a.team==='LD'?'0':a.team).localeCompare(b.team==='LD'?'0':b.team)||ROLES.indexOf(a.role)-ROLES.indexOf(b.role)||a.name.localeCompare(b.name,'vi'));
  return '<select class="inp" id="'+id+'" aria-label="'+label+'">'+opt('',allLabel,cur)+'<optgroup label="Theo tổ">'+TEAMS.map(t=>opt('t:'+t.id,t.name,cur)).join('')+'</optgroup>'+
    '<optgroup label="Theo người">'+ppl.map(p=>opt('p:'+p.id,p.name+' · '+(p.team==='LD'?'Phó phường':team(p.team).name)+(p.off?' (đã chuyển)':''),cur)).join('')+'</optgroup></select>'; }
const whoMatch=(a,k)=>!k||(k[0]==='t'?aTeam(a)===k.slice(2):a.k==='p'&&a.id===k.slice(2));
const taskText=t=>norm(t.id+' '+t.title+' '+t.src+' '+whoShort(t)+' '+t.stages.map(s=>s.name).join(' '));

const F={who:'',kd:'',late:false,q:''}, FP={p:'all',b:'assigned',from:'',to:''};
function taskList(){ const q=norm(F.q.trim()); return TASKS.filter(t=>(!F.kd||t.kind===F.kd)&&(!F.who||t.who.some(a=>whoMatch(a,F.who)))&&inPer(t,FP)&&(!F.late||taskState(t)==='over')&&(!q||taskText(t).includes(q))); }
function renderTasks(){
  $('#pg-tasks').innerHTML='<div style="display:flex;flex-direction:column;gap:16px"><div class="toolbar">'+
    seg('tv',TV,[['board','Bảng Kanban','kanban'],['list','Danh sách','list']])+
    '<div class="search grow">'+ic('search',16)+'<input class="inp" id="fq" type="search" placeholder="Tìm tên việc, số văn bản, người nhận…" value="'+esc(F.q)+'" autocomplete="off"></div></div>'+
    '<div class="toolbar">'+whoSel('fwho',F.who,'Mọi tổ và người','Lọc theo tổ hoặc người nhận')+
    '<select class="inp" id="fkd" aria-label="Lọc theo cách theo dõi">'+opt('','Mọi cách theo dõi',F.kd)+Object.keys(KIND).map(k=>opt(k,KIND[k],F.kd)).join('')+'</select>'+
    perCtl('tper',FP)+
    '<button type="button" class="tgl" id="lateBtn" data-act="late" aria-pressed="'+F.late+'"></button>'+
    '<button type="button" class="btn ghost sm" id="clrBtn" data-act="clr">'+ic('x',15)+'Bỏ lọc</button>'+
    '<span class="end tab" id="tCount"></span></div><div id="tBody"></div></div>';
  renderTaskBody();
}
function renderTaskBody(){
  const list=taskList(), overN=list.filter(t=>taskState(t)==='over').length, openN=list.filter(t=>taskState(t)!=='done').length;
  const lb=$('#lateBtn'); lb.className='tgl'+(F.late?' on':overN?' warn':''); lb.innerHTML=ic('alarm',15)+'Trễ hạn <span class="tab">'+(F.late?overN:TASKS.filter(t=>taskState(t)==='over').length)+'</span>';
  const filtered=F.who||F.kd||F.late||F.q||FP.p!=='all';
  $('#clrBtn').hidden=!filtered;
  $('#tCount').innerHTML=(filtered?'Tìm thấy <b>'+list.length+'</b> việc · ':'')+openN+' đang mở'+(overN?' · <b style="color:var(--r600)">'+overN+' trễ hạn</b>':'');
  if(!TASKS.length){ $('#tBody').innerHTML=empty('clip','Chưa có công việc nào',ADM()?'Bấm “Giao việc mới” để ghi lại việc đầu tiên.':'Chưa có việc nào được giao.',ADM()?'<button class="btn accent sm" data-act="give">'+ic('plus',15)+'Giao việc mới</button>':''); return; }
  if(TV==='board'){
    const COLS=[['over','Quá hạn','var(--r500)'],['soon','Sắp đến hạn','var(--a500)'],['doing','Đang làm','var(--i500)'],['done','Hoàn thành','var(--e500)']];
    $('#tBody').innerHTML='<div class="board thin">'+COLS.map(c=>{const items=list.filter(t=>taskState(t)===c[0]).sort((a,b)=>curDue(a)<curDue(b)?-1:1); if(c[0]==='done') items.reverse();
      return '<div class="col"><div class="colh"><span class="dot" style="width:10px;height:10px;background:'+c[2]+'"></span><b>'+c[1]+'</b><span class="n tab">'+items.length+'</span></div><div class="colb">'+
      (items.map(taskCard).join('')||'<div class="colempty">Không có việc</div>')+'</div></div>';}).join('')+'</div>';
  } else {
    const ord={over:0,soon:1,doing:2,done:3};
    const rows=list.slice().sort((a,b)=>ord[taskState(a)]-ord[taskState(b)]||(curDue(a)<curDue(b)?-1:1));
    $('#tBody').innerHTML='<div class="card" style="overflow:hidden">'+(rows.length?'<div class="tscroll thin"><table class="t" style="min-width:900px"><thead><tr><th>Công việc</th><th>Cách theo dõi</th><th>Giao cho</th><th>Hạn</th><th>Tiến độ</th><th>Trạng thái</th></tr></thead><tbody>'+
      rows.map(t=>{const p=prog(t), st=taskState(t);return '<tr class="hov'+(st==='over'?' redrow':'')+'" tabindex="0" data-act="open" data-id="'+t.id+'"><td style="min-width:260px"><div class="tname"'+(st==='done'?' style="color:var(--s600);text-decoration:line-through"':'')+'>'+esc(t.title)+'</div><div class="tsub">'+(t.src?esc(t.src):'Không có văn bản')+'</div></td>'+
        '<td>'+kindChip(t)+'</td><td style="min-width:180px"><div class="row" style="gap:8px;flex-wrap:nowrap">'+avStack(t.who,3,24)+'<span style="font-size:13px;color:var(--s700)">'+esc(t.who.length===1?aName(t.who[0]):t.who.length+' đầu mối')+'</span></div></td>'+
        '<td>'+dueBadge(t)+'</td><td style="min-width:140px"><div class="row" style="flex-wrap:nowrap;gap:8px">'+bar(p.pct)+'<span class="tab" style="font-size:12px;color:var(--s600)">'+p.d+'/'+p.tot+'</span></div></td><td>'+stBadge(t)+'</td></tr>';}).join('')+'</tbody></table></div>'
      :'<div class="cpad">'+empty('clip','Không có công việc phù hợp','Thử bỏ bộ lọc hoặc giao việc mới.')+'</div>')+'</div>';
  }
}
function taskCard(t){
  const p=prog(t), st=taskState(t), logs=t.log.length;
  return '<div class="tcard '+(st==='over'?'over':st==='done'?'done':'')+'" role="button" tabindex="0" data-act="open" data-id="'+t.id+'">'+
    '<div class="tc-top">'+kindChip(t)+'<span class="tc-src">'+esc(t.src||'')+'</span></div>'+
    '<div class="tc-title">'+esc(t.title)+'</div>'+
    (t.kind!=='once'&&p.tot?'<div class="tc-prog">'+ic(t.kind==='stage'?'layers':'listcheck',14,'')+bar(p.pct)+'<span class="tab">'+p.d+'/'+p.tot+'</span></div>':'')+
    '<div class="tc-bot"><div class="l">'+avStack(t.who,3,22)+'<span class="nm">'+esc(t.who.length===1?shortName(aName(t.who[0])):t.who.length+' đầu mối')+'</span></div>'+
    '<div class="r">'+(logs?'<span class="row" style="gap:2px">'+ic('msg',12)+logs+'</span>':'')+dueBadge(t)+'</div></div></div>';
}

/* ---- Chi tiết việc ---- */
function openTask(id){
  const t=findTask(id); if(!t){ closeModal(); return; }
  const adm=ADM(), st=taskState(t), n=days(curDue(t),TODAY);
  const stages=t.kind==='stage'?'<div class="sec"><h4>'+ic('layers',16)+'Các giai đoạn</h4>'+t.stages.map(s=>'<label class="stage'+(s.done?' dn':'')+'" for="st-'+s.n+'"><input type="checkbox" id="st-'+s.n+'" data-act2="stage" data-id="'+t.id+'" data-n="'+s.n+'"'+(s.done?' checked':'')+(adm?'':' disabled')+'><div class="m"><b>'+s.n+'. '+esc(s.name)+'</b><div class="tsub">Hạn '+fmtY(s.due)+(s.done?' · xong '+fmt(s.done):'')+'</div></div>'+
    (s.done?'<span class="st '+(s.done<=s.due?'done">Đúng hạn':'late">Trễ hạn')+'</span>':(s.due<TODAY?'<span class="st over">Quá hạn</span>':''))+'</label>').join('')+'</div>':'';
  const rec='<div class="sec"><h4>'+ic('users',16)+'Người nhận việc ('+t.who.length+')</h4><div>'+t.who.map(a=>{const s=rowState(t,a);return '<div class="rcp">'+avatar(a,32)+'<div class="m"><b>'+esc(aName(a))+'</b><small>'+esc(aSub(a))+'</small></div>'+
    '<div style="text-align:right"><span class="st '+s+'">'+ROWTXT[s]+'</span>'+(a.done?'<div class="tsub">ngày '+fmt(a.done)+'</div>':'')+'</div>'+
    (t.kind==='result'&&adm?'<button class="btn xs '+(a.done?'ghost':'soft')+'" data-act="toggle" data-id="'+t.id+'" data-key="'+aKey(a)+'" data-on="'+(a.done?0:1)+'">'+(a.done?'Bỏ đánh dấu':ic('check',13)+'Đã xong')+'</button>':'')+'</div>';}).join('')+'</div></div>';
  const logs='<div class="sec"><h4>'+ic('msg',16)+'Nhật ký phản hồi và đôn đốc ('+t.log.length+')</h4><div class="logs thin">'+(t.log.length?t.log.slice().reverse().map(l=>'<div class="lg">'+(l[3]?avatar({k:l[3][0],id:l[3].slice(2)},26):'<span class="av" style="width:26px;height:26px;background:var(--s300)">'+ic('file',13)+'</span>')+
      '<div class="bub'+(l[2]?' rem':'')+'"><div class="h"><b>'+(l[3]?esc(keyName(l[3])):'Ghi chung')+'</b><span>'+fmtY(l[0])+(l[4]?' · '+esc(l[4]):'')+'</span></div><p>'+esc(l[1])+'</p></div></div>').join(''):'<p class="faint" style="margin:0;font-size:13px">Chưa có ghi nhận.</p>')+'</div>'+
    (adm?'<div style="display:flex;flex-direction:column;gap:8px;margin-top:4px"><select class="inp" id="logFor" aria-label="Ghi chú cho ai"><option value="">Ghi chung cho cả việc</option>'+t.who.map(a=>'<option value="'+aKey(a)+'">Riêng: '+esc(aName(a))+'</option>').join('')+'</select>'+
      '<textarea class="inp" id="logInput" rows="2" placeholder="Ghi nhận mới, ví dụ: đã gửi bản nháp, hẹn hoàn thiện thứ Sáu (Ctrl+Enter để ghi)"></textarea>'+
      '<button class="btn primary sm" style="align-self:flex-end" data-act="addLog" data-id="'+t.id+'">'+ic('send',15)+'Ghi lại</button></div>':'')+'</div>';
  const side='<div class="box"><div class="kv"><span>Trạng thái</span><b>'+stBadge(t)+'</b></div>'+
    '<div class="kv"><span>Cách theo dõi</span><b>'+kindChip(t)+'</b></div>'+
    '<div class="kv"><span>Nguồn giao việc</span><b>'+(t.src?esc(t.src):'Không có văn bản')+'</b></div>'+
    '<div class="grid2" style="gap:12px"><div class="kv"><span>Ngày giao</span><b>'+fmtY(t.assigned)+'</b></div><div class="kv"><span>Hạn cuối</span><b'+(st==='over'?' style="color:var(--r600)"':'')+'>'+fmtY(t.due)+'</b></div></div>'+
    (t.by?'<div class="kv"><span>Người giao</span><b>'+esc(t.by)+'</b></div>':'')+
    (st==='over'?'<div class="row" style="gap:6px;font-size:12px;font-weight:600;color:var(--r600)">'+ic('alert',14)+'Đã quá hạn '+(-n)+' ngày</div>':'')+'</div>';
  modal({title:t.title,sub:(t.src?t.src+' · ':'')+'Giao ngày '+fmtY(t.assigned),size:'xl',
    body:'<div class="dgrid"><div style="display:flex;flex-direction:column;gap:20px;min-width:0">'+stages+rec+'</div><aside style="display:flex;flex-direction:column;gap:20px;min-width:0">'+side+logs+'</aside></div>',
    foot:(adm?'<button class="btn dghost sp" data-act="delTask" data-id="'+t.id+'">'+ic('trash',16)+'Xóa việc</button><button class="btn secondary" data-act="editTask" data-id="'+t.id+'">'+ic('pencil',16)+'Sửa tên, nguồn, hạn</button>':'')+
      (st!=='done'?'<button class="btn accent" data-act="remind" data-id="'+t.id+'">'+ic('megaphone',16)+'Soạn lời nhắc</button>':'<button class="btn secondary" data-act="close">Đóng</button>')});
}
function openEditTask(id){
  const t=findTask(id);
  modal({title:'Sửa việc',sub:t.title,size:'md',
    body:'<div class="form"><div class="field"><label for="etTitle">Tên việc</label><input class="inp" id="etTitle" value="'+esc(t.title)+'"></div>'+
      '<div class="field"><label for="etSrc">Nguồn giao việc</label><input class="inp" id="etSrc" value="'+esc(t.src)+'"></div>'+
      '<div class="field"><label for="etDue">Hạn cuối</label><input class="inp" type="date" id="etDue" value="'+t.due+'"><div class="hint">Đổi hạn sẽ được ghi vào nhật ký.</div></div></div>',
    foot:'<button class="btn ghost" data-act="open" data-id="'+t.id+'">Quay lại</button><button class="btn accent" data-act="saveTask" data-id="'+t.id+'">Lưu</button>'});
}
function openRemind(id){
  const t=findTask(id), cd=curDue(t), n=days(cd,TODAY), st=curStage(t);
  const names=t.who.filter(a=>!a.done).map(a=>a.k==='t'?team(a.id).name:'đồng chí '+aName(a)).join(', ');
  const txt='Kính gửi '+names+'.\n\nViệc: "'+t.title+'"'+(t.src?' (theo '+t.src+')':'')+'.'+(st?'\nGiai đoạn: '+st.name+'.':'')+'\nHạn: '+fmtY(cd)+(n<0?', hiện đã quá hạn '+(-n)+' ngày':n===0?', là hôm nay':', còn '+n+' ngày')+'.\n\nĐề nghị báo kết quả hoặc tiến độ về Tổ TH trong hôm nay để tổng hợp báo cáo lãnh đạo.\nTrân trọng.';
  modal({title:'Lời nhắc soạn sẵn',sub:'Sao chép rồi dán vào Zalo hoặc tin nhắn. Có thể sửa lời trước khi sao chép.',size:'md',
    body:'<textarea class="inp" id="remindTxt" rows="10" aria-label="Nội dung lời nhắc">'+esc(txt)+'</textarea>',
    foot:'<button class="btn ghost sp" data-act="open" data-id="'+t.id+'">Về chi tiết việc</button>'+(ADM()?'<button class="btn secondary" data-act="logRemind" data-id="'+t.id+'">'+ic('history',16)+'Ghi là đã nhắc</button>':'')+'<button class="btn accent" data-act="copy">'+ic('copy',16)+'Sao chép</button>'});
}

/* ---- Giao việc mới ---- */
let PICK=[], stageN=0;
const has=(k,id)=>PICK.some(a=>a.k===k&&a.id===id);
function openGive(src){
  PICK=[]; stageN=0;
  modal({title:'Giao việc mới',sub:'Ghi lại việc đã giao, người nhận và hạn hoàn thành',size:'lg',
    body:'<form class="form" id="giveForm" novalidate>'+
      '<div class="field"><label for="fTitle">Tên việc</label><input class="inp" id="fTitle" placeholder="Ví dụ: Báo cáo kết quả công tác tháng 11"></div>'+
      '<div class="grid2"><div class="field"><label for="fSrc">Nguồn giao việc</label><input class="inp" id="fSrc" value="'+esc(src||'')+'" placeholder="Số văn bản, kết luận họp… (bỏ trống nếu không có)"></div>'+
      '<div class="field"><label for="fDue">Hạn hoàn thành</label><input class="inp" type="date" id="fDue" value="'+addDays(TODAY,7)+'"></div></div>'+
      '<div class="field"><label for="fKind">Cách theo dõi</label><select class="inp" id="fKind">'+opt('once',KIND.once,'result')+opt('result',KIND.result,'result')+opt('stage',KIND.stage,'result')+'</select><div class="hint" id="fKindHint">'+KHINT.result+'</div></div>'+
      '<div class="field" id="fStagesBox" hidden><span class="lbl">Các giai đoạn (tên và hạn từng giai đoạn)</span><div id="fStages" style="display:flex;flex-direction:column;gap:8px"></div><div><button type="button" class="btn soft sm" data-act="addStage">'+ic('plus',15)+'Thêm giai đoạn</button></div></div>'+
      '<div class="field"><span class="lbl">Giao cho tổ</span><div class="tmpick" id="fTeams"></div></div>'+
      '<div class="field"><label for="fName">Hoặc giao cho người (gõ tên)</label>'+
        '<div class="nmbox"><div class="row" style="gap:8px;flex-wrap:nowrap"><input class="inp" id="fName" placeholder="Gõ họ tên rồi bấm Enter" autocomplete="off" style="flex:1"><button type="button" class="btn soft" data-act="addName">'+ic('plus',15)+'Thêm</button></div><div class="nmsug thin" id="fSug" hidden></div></div>'+
        '<div class="hint">Gõ không dấu cũng được, chọn trong gợi ý hoặc gõ tên mới. Cả tổ: chung 1 dòng tiến độ; từng người: mỗi người 1 dòng.</div></div>'+
      '<div class="field"><div class="row between"><b style="font-size:13px" id="fCount"></b><button type="button" class="btn ghost xs" data-act="pickNone">Bỏ chọn tất cả</button></div><div class="pchips" id="fWho"></div></div>'+
      '<div class="err" id="giveErr" hidden></div></form>',
    foot:'<button class="btn ghost" data-act="close">Huỷ</button><button class="btn accent" data-act="giveSubmit">'+ic('send',16)+'Giao việc</button>'});
  renderWho(); setTimeout(()=>$('#fTitle').focus(),60);
}
let SUG=[], SUGI=0;
function renderTeams(){
  const box=$('#fTeams'); if(!box) return;
  box.innerHTML=TEAMS.map(t=>{const on=has('t',t.id);return '<button type="button" class="tmbtn'+(on?' on':'')+'" data-act="pickTeam" data-id="'+esc(t.id)+'" aria-pressed="'+on+'">'+(on?ic('check',14):'')+esc(t.name)+'</button>';}).join('')||'<span class="muted">Chưa có tổ nào.</span>';
}
function renderSug(){
  const box=$('#fSug'), inp=$('#fName'); if(!box||!inp) return;
  const q=norm(inp.value.trim());
  SUG=q?ACTIVE().filter(p=>norm(p.name).includes(q)&&!has('p',p.id)).slice(0,8):[];
  if(SUGI>=SUG.length) SUGI=0;
  box.hidden=!SUG.length;
  box.innerHTML=SUG.map((p,i)=>'<button type="button" data-act="pickSug" data-i="'+i+'"'+(i===SUGI?' class="hi"':'')+'>'+avP(p,22)+'<span>'+esc(p.name)+'</span><small>'+esc(pSub(p))+'</small></button>').join('');
}
function addName(){
  const inp=$('#fName'), v=inp.value.trim().replace(/\s+/g,' ');
  if(!v) return;
  const exact=ACTIVE().find(p=>norm(p.name)===norm(v));
  const p=exact||(SUG.length?SUG[SUGI]:null);
  if(p){ setWho('p:'+p.id,true); }
  else if(!PICK.some(a=>a.k==='p'&&norm(aName(a))===norm(v))) PICK.push({k:'p',id:v,nm:v});
  inp.value=''; SUG=[]; SUGI=0; renderWho(); inp.focus();
}
function renderPick(){ renderTeams(); renderSug(); }
function renderWho(){
  renderPick(); if(!$('#fWho')) return;
  $('#fCount').textContent=PICK.length?'Đã chọn '+PICK.length+' đầu mối':'Chưa chọn ai';
  $('#fWho').innerHTML=PICK.map((a,i)=>'<span class="pchip">'+esc(aName(a))+'<button type="button" data-act="delWho" data-i="'+i+'" aria-label="Bỏ '+esc(aName(a))+'">'+ic('x',13)+'</button></span>').join('');
}
function setWho(v,on){ const k=v[0], id=v.slice(2); if(on){ if(!has(k,id)) PICK.push({k:k,id:id}); } else PICK=PICK.filter(a=>!(a.k===k&&a.id===id)); }
function addStage(name,due){ stageN++; const d=document.createElement('div'); d.className='stagerow';
  d.innerHTML='<input class="inp" id="sn-'+stageN+'" placeholder="Tên giai đoạn" value="'+esc(name||'')+'" aria-label="Tên giai đoạn"><input class="inp" type="date" id="sd-'+stageN+'" value="'+(due||'')+'" aria-label="Hạn giai đoạn"><button type="button" class="ibtn" data-act="delStage" aria-label="Bỏ giai đoạn">'+ic('x',16)+'</button>'; $('#fStages').appendChild(d); }
function giveErr(m){ $('#giveErr').textContent=m; $('#giveErr').hidden=!m; }
function submitGive(){
  giveErr('');
  const kind=$('#fKind').value, title=$('#fTitle').value.trim(), due=$('#fDue').value;
  if(!title) return giveErr('Chưa nhập tên việc.');
  if(!due) return giveErr('Chưa chọn hạn hoàn thành.');
  if(!PICK.length) return giveErr('Chưa chọn người nhận việc.');
  let stages=[];
  if(kind==='stage'){ stages=[].slice.call(document.querySelectorAll('#fStages .stagerow')).map(r=>({name:r.children[0].value.trim(),due:r.children[1].value})).filter(s=>s.name&&s.due);
    if(!stages.length) return giveErr('Cần ít nhất một giai đoạn có tên và hạn.'); }
  const n=PICK.length;
  act('createTask',[{title:title,src:$('#fSrc').value.trim(),kind:kind,due:due,who:PICK.map(a=>({k:a.k,id:a.id})),stages:stages}],'Đã giao việc cho '+n+' đầu mối.',()=>{ PICK=[]; $('#ov').hidden=true; document.body.classList.remove('lock'); go('tasks'); });
}

/* ================= Lịch họp ================= */
let MV='up';
function renderMeet(){
  let list=MEETS.filter(m=>MV==='all'||(MV==='up'?m.d>=TODAY:m.d<TODAY));
  list.sort((a,b)=>(a.d+a.t)<(b.d+b.t)?-1:1); if(MV==='past') list.reverse();
  const groups=[]; list.forEach(m=>{ const g=groups[groups.length-1]; if(g&&g.d===m.d) g.items.push(m); else groups.push({d:m.d,items:[m]}); });
  $('#pg-meet').innerHTML='<div style="display:flex;flex-direction:column;gap:20px"><div class="toolbar">'+seg('mv',MV,[['up','Sắp tới'],['past','Đã qua'],['all','Tất cả']])+'<span class="end">'+list.length+' cuộc họp</span></div>'+
    (groups.length?'<div class="card cpad"><div class="lst">'+groups.map(g=>'<div class="li" style="align-items:flex-start"><span class="dblk'+(g.d===TODAY?' today':'')+'"><b>'+g.d.slice(8,10)+'</b><small>'+WD[wd(g.d)]+'</small></span><div class="m" style="display:flex;flex-direction:column;gap:10px"><div class="faint" style="font-size:12px;font-weight:600">'+WDL[wd(g.d)]+', '+fmtY(g.d)+(g.d===TODAY?' · Hôm nay':'')+'</div>'+
      g.items.map(m=>'<div class="row between" style="flex-wrap:nowrap;align-items:flex-start"><div style="min-width:0"><div class="tt" style="font-size:14px;font-weight:500">'+(m.t?'<span class="tab" style="color:var(--i700);font-weight:600">'+esc(m.t)+'</span> · ':'')+esc(m.name)+'</div>'+
        '<div class="ss" style="font-size:12px;color:var(--s600);margin-top:2px">'+[m.place?ic('pin',12)+' '+esc(m.place):'',m.chair?'Chủ trì: '+esc(m.chair):''].filter(Boolean).join(' · ')+'</div>'+
        ((m.who||m.prep)?'<div class="ss" style="font-size:12px;color:var(--s600)">'+[m.who?'Thành phần: '+esc(m.who):'',m.prep?'Cần chuẩn bị: '+esc(m.prep):''].filter(Boolean).join(' · ')+'</div>':'')+'</div>'+
        (ADM()?'<div class="row" style="flex-wrap:nowrap;gap:2px"><button class="btn xs soft" data-act="fromMeet" data-id="'+m.id+'" title="Giao việc từ kết luận họp">'+ic('send',13)+'Giao việc</button><button class="ibtn" data-act="editMeet" data-id="'+m.id+'" aria-label="Sửa cuộc họp">'+ic('pencil',15)+'</button></div>':'')+'</div>').join('')+'</div></div>').join('')+'</div></div>'
    :empty('calendar',MV==='past'?'Chưa có cuộc họp nào đã qua':'Chưa có cuộc họp sắp tới',ADM()?'Bấm “Thêm cuộc họp” để ghi lịch.':'',ADM()?'<button class="btn accent sm" data-act="editMeet" data-id="">'+ic('plus',15)+'Thêm cuộc họp</button>':''))+'</div>';
}
function openMeet(id){
  const m=MEETS.find(x=>x.id===id)||{d:TODAY,t:'08:00',name:'',place:'',chair:'',who:'',prep:''};
  const f=(k,l,type,ph)=>'<div class="field"><label for="m_'+k+'">'+l+'</label><input class="inp" type="'+(type||'text')+'" id="m_'+k+'" value="'+esc(m[k])+'"'+(ph?' placeholder="'+ph+'"':'')+'></div>';
  modal({title:id?'Sửa cuộc họp':'Thêm cuộc họp',sub:id?m.name:'Ghi lịch họp để theo dõi trên Tổng quan',size:'md',

}

  } else {
    const rows=detailRows(ts);
    REPORT={title:'Báo cáo chi tiết từng việc, '+per,headers:['STT','Đầu việc','Nguồn','Người chịu trách nhiệm','Chức vụ, tổ','Hạn','Tiến độ','Kết quả','Đã nhắc','Ghi chú gần nhất'],
      rows:rows.map((x,i)=>{const t=x[0],a=x[1],n=reminds(t,a);return [i+1,t.title,t.src||'Không có văn bản',aName(a),aSub(a),fmtY(t.due),progTxt(t,a),resultTxt(t,a)[1],a.done?'Không cần':n?n+' lần':'Chưa nhắc',noteText(t,a)];})};
    body=rows.length?'<div class="tscroll thin"><table class="t" style="min-width:1100px"><thead><tr><th class="num">STT</th><th>Đầu việc</th><th>Người chịu trách nhiệm</th><th>Hạn</th><th>Tiến độ</th><th>Kết quả</th><th>Đã nhắc</th><th>Ghi chú gần nhất</th></tr></thead><tbody>'+

    '<div class="search grow">'+ic('search',16)+'<input class="inp" id="rq" type="search" placeholder="Tìm tên việc, số văn bản…" value="'+esc(RQ)+'" autocomplete="off"></div></div>'+
    '<div class="toolbar">'+perCtl('rper',RPP)+
    (RV==='detail'?whoSel('rf',RF,'Tất cả tổ và người','Lọc theo tổ hoặc người'):'')+
    '<span class="end tab">'+ts.length+' việc · '+esc(per)+'</span></div>'+
    '<div class="card" style="overflow:hidden"><div class="cpad" style="border-bottom:1px solid var(--s100)"><div class="stitle"><div class="l"><span class="itile">'+ic('chart',18)+'</span><div><h2>'+esc(REPORT.title.replace(/^Báo cáo /,'').replace(/^./,c=>c.toUpperCase()))+'</h2><p>'+(RV==='detail'?'Mỗi dòng là một việc của một người hoặc tổ nhận · ghi chú ưu tiên ghi chú riêng của người đó · số lần nhắc tính từ “Ghi là đã nhắc”':RV==='team'?'Việc giao cho từng người tính vào tổ của người đó':'Chỉ tính việc giao đích danh từng người')+'</p></div></div></div></div>'+body+'</div></div>';
}
function detailRows(ts){ const rows=[]; ts.forEach(t=>t.who.forEach(a=>{ if(whoMatch(a,RF)) rows.push([t,a]); })); return rows; }

/* Kiểu cột: 'd' = ngày (yyyy-mm-dd), 'n' = số, 'p' = phần trăm (0–1), còn lại là chữ. */
function buildExport(){
  const ts=reportTasks(), per=perLabel(RPP), q=RQ.trim(), rf=RF?keyName(RF):'';
  const cond='Khoảng thời gian: '+per+(q?' · Tìm: “'+q+'”':'')+(rf?' · Tổ/người: '+rf:'');
  const lastRemind=(t,a)=>{ const l=t.log.slice().reverse().find(x=>x[2]&&x[2].includes(aKey(a))); return l?l[0]:''; };
  const ppl=a=>a.k==='p'?person(a.id):null;
  /* 1. Chi tiết */
  const det=detailRows(ts).map((x,i)=>{ const t=x[0],a=x[1],p=ppl(a),r=resultTxt(t,a);
    const lag=t.kind==='once'?'':a.done?days(a.done,t.due):(curDue(t)<TODAY?days(TODAY,curDue(t)):'');
    return [i+1,t.id,t.title,t.src||'Không có văn bản',KIND[t.kind],t.assigned,t.due,aName(a),a.k==='t'?'Cả tổ':'Cá nhân',p?p.role:'',a.k==='t'?team(a.id).name:(p?(p.team==='LD'?'Lãnh đạo phường':team(p.team).name):''),
      a.done||'',progTxt(t,a),r[1],lag,a.done?'':reminds(t,a),lastRemind(t,a),noteText(t,a),t.by||'']; });
  /* 2–3. Tổng hợp theo tổ / theo người */
  const cnt=f=>{ const c={all:0,early:0,ontime:0,late:0,doing:0,over:0,rem:0}; ts.forEach(t=>t.who.forEach(a=>{ if(!f(a)) return; c.all++; c[rowState(t,a)]++; c.rem+=reminds(t,a); })); return c; };
  const sumRow=c=>{ const done=c.early+c.ontime+c.late; return [c.all,c.early,c.ontime,c.late,c.doing,c.over,c.all?done/c.all:'',done?(c.early+c.ontime)/done:'',c.rem]; };
  const SH=['Được giao','Xong trước hạn','Xong đúng hạn','Xong trễ hạn','Đang làm','Quá hạn chưa xong','Tỷ lệ hoàn thành','Tỷ lệ đúng hạn (trong số đã xong)','Số lần đã nhắc'];
  const ST=['n','n','n','n','n','n','p','p','n'];
  const byTeam=TEAMS.map(tm=>[tm.name].concat(sumRow(cnt(a=>aTeam(a)===tm.id)))).concat([['Tổng cộng'].concat(sumRow(cnt(()=>true)))]);
  const byPerson=PEOPLE.map(p=>[p,cnt(a=>a.k==='p'&&a.id===p.id)]).filter(x=>x[1].all).map(x=>[x[0].name,x[0].role,x[0].team==='LD'?'Lãnh đạo phường':team(x[0].team).name].concat(sumRow(x[1])));
  /* 4. Giai đoạn */
  const stg=[]; ts.filter(t=>t.kind==='stage').forEach(t=>t.stages.forEach(s=>{ const r=s.done?(s.done<s.due?'Xong trước hạn':s.done===s.due?'Xong đúng hạn':'Xong trễ hạn'):(s.due&&s.due<TODAY?'Quá hạn':'Đang làm');
    stg.push([t.id,t.title,s.n,s.name,s.due||'',s.done||'',r]); }));
  /* 5. Nhật ký */
  const logs=[]; ts.forEach(t=>t.log.forEach(l=>logs.push([l[0],t.id,t.title,l[1],l[3]?keyName(l[3]):'Chung cả việc',l[2]?'Có':'',l[2]?l[2].map(keyName).join(', '):'',l[4]||''])));
  logs.sort((x,y)=>x[0]<y[0]?-1:x[0]>y[0]?1:0);
  /* 0. Tổng hợp chung */
  const all=cnt(()=>true), done=all.early+all.ontime+all.late;
  const info=[['Khoảng thời gian',per],['Điều kiện lọc',(q?'Tìm “'+q+'”':'Không')+(rf?' · Tổ/người: '+rf:'')],['Ngày xuất',fmtY(TODAY)],['Người xuất',ME?ME.name:''],
    ['Số việc',ts.length],['Số lượt giao (việc × người/tổ nhận)',all.all],['Đã xong',done],['  · Xong trước hạn',all.early],['  · Xong đúng hạn',all.ontime],['  · Xong trễ hạn',all.late],
    ['Đang làm (chưa đến hạn)',all.doing],['Quá hạn chưa xong',all.over],['Tỷ lệ hoàn thành',all.all?done/all.all:''],['Tổng số lần đã nhắc',all.rem]];
  const title='Báo cáo công việc QLCV Hoàng Mai, '+per;
  return {title:title,file:'QLCV_BaoCao_'+(perRange(RPP)[0]||'tatca')+'_'+(perRange(RPP)[1]||TODAY)+'.xlsx',sheets:[
    {name:'Tổng hợp',title:title,sub:cond,headers:['Nội dung','Số liệu'],types:['','x'],widths:[38,40],rows:info},
    {name:'Chi tiết',title:'Chi tiết từng việc, từng người/tổ nhận',sub:cond,headers:['STT','Mã việc','Đầu việc','Nguồn / văn bản','Cách theo dõi','Ngày giao','Hạn','Người / tổ chịu trách nhiệm','Giao cho','Chức vụ','Thuộc tổ','Ngày báo xong','Tiến độ','Kết quả','Chênh hạn (ngày, âm = sớm)','Số lần đã nhắc','Lần nhắc gần nhất','Ghi chú gần nhất','Người giao'],
      types:['n','','','','','d','d','','','','','d','','r','n','n','d','',''],widths:[6,9,40,20,18,11,11,24,9,12,16,12,30,22,12,9,12,44,14],rows:det},
    {name:'Theo tổ',title:'Tổng hợp theo tổ',sub:cond+' · việc giao cho từng người tính vào tổ của người đó',headers:['Tổ'].concat(SH),types:[''].concat(ST),widths:[18,10,10,10,10,10,12,12,16,10],rows:byTeam,total:true},
    {name:'Theo người',title:'Tổng hợp theo người',sub:cond+' · chỉ tính việc giao đích danh từng người',headers:['Họ tên','Chức vụ','Tổ'].concat(SH),types:['','',''].concat(ST),widths:[24,12,16,10,10,10,10,10,12,12,16,10],rows:byPerson},
    {name:'Giai đoạn',title:'Các giai đoạn của việc theo giai đoạn',sub:cond,headers:['Mã việc','Đầu việc','STT','Giai đoạn','Hạn','Ngày xong','Kết quả'],types:['','','n','','d','d','r'],widths:[9,40,6,30,11,11,16],rows:stg},
    {name:'Nhật ký',title:'Nhật ký phản hồi và đôn đốc',sub:cond,headers:['Ngày','Mã việc','Đầu việc','Nội dung','Ghi cho','Là lần nhắc','Nhắc ai','Người ghi'],types:['d','','','','','','',''],widths:[11,9,36,50,22,9,26,14],rows:logs}
  ]};
}
let XLP=null;
function loadXL(){ if(window.ExcelJS) return Promise.resolve(); if(!XLP) XLP=new Promise((res,rej)=>{ const s=document.createElement('script');
  s.src='https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js'; s.onload=()=>res(); s.onerror=()=>{ XLP=null; s.remove(); rej(new Error('Không tải được bộ tạo file Excel. Kiểm tra mạng rồi thử lại.')); }; document.head.appendChild(s); }); return XLP; }
const xDate=s=>{ if(!s) return null; const p=s.split('-'); return new Date(Date.UTC(+p[0],+p[1]-1,+p[2])); };
async function makeXlsx(X){
  await loadXL();
  const wb=new ExcelJS.Workbook(); wb.creator='QLCV Hoàng Mai'; wb.created=new Date();
  const BLUE='FF1E46C8', LINE={style:'thin',color:{argb:'FFD5DDEE'}}, BOX={top:LINE,left:LINE,bottom:LINE,right:LINE};
  X.sheets.forEach(sd=>{
    const n=sd.headers.length, ws=wb.addWorksheet(sd.name,{views:[{state:'frozen',ySplit:4}],pageSetup:{orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:0,paperSize:9}});
    ws.columns=sd.widths.map(w=>({width:w}));
    ws.mergeCells(1,1,1,Math.max(n,2)); ws.getCell(1,1).value=sd.title; ws.getCell(1,1).font={bold:true,size:14,color:{argb:'FF0D1733'}};
    ws.mergeCells(2,1,2,Math.max(n,2)); ws.getCell(2,1).value=sd.sub+' · Xuất ngày '+fmtY(TODAY)+' từ QLCV Hoàng Mai'; ws.getCell(2,1).font={italic:true,size:10,color:{argb:'FF5A6A86'}};
    const hr=ws.getRow(4); hr.values=sd.headers; hr.height=32;
    hr.eachCell(c=>{ c.font={bold:true,color:{argb:'FFFFFFFF'}}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:BLUE}}; c.alignment={vertical:'middle',horizontal:'center',wrapText:true}; c.border=BOX; });
    sd.rows.forEach((r,ri)=>{
      const row=ws.getRow(5+ri);
      r.forEach((v,ci)=>{ const ty=sd.types[ci], c=row.getCell(ci+1);
        if(ty==='d'){ c.value=xDate(v); c.numFmt='dd/mm/yyyy'; }
        else if(ty==='n'){ c.value=v===''||v===null||v===undefined?null:+v; }
        else if(ty==='p'){ c.value=v===''?null:v; c.numFmt='0%'; }
        else if(ty==='x'){ c.value=v===''?null:v; if(typeof v==='number'&&/Tỷ lệ/.test(r[0])) c.numFmt='0%'; }
        else c.value=v===null||v===undefined?'':String(v);
        c.border=BOX; c.alignment=ty==='x'?{vertical:'top',horizontal:'left',wrapText:true}:{vertical:'top',wrapText:true};
        if(ty==='r'){ const s=String(v); c.font={bold:true,color:{argb:/Quá hạn|trễ/.test(s)?'FFC81E1E':/Xong|Đã giao/.test(s)?'FF15803D':'FF1E46C8'}}; }
      });
      if(sd.total&&ri===sd.rows.length-1) row.eachCell(c=>{ c.font={bold:true}; c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEAF0FF'}}; });
      else if(ri%2) row.eachCell(c=>{ if(!c.fill||c.fill.type!=='pattern') c.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFF7F9FE'}}; });
    });
    if(!sd.rows.length){ ws.getCell(5,1).value='(Không có dữ liệu trong khoảng thời gian này)'; ws.getCell(5,1).font={italic:true,color:{argb:'FF5A6A86'}}; }
    else if(sd.name!=='Tổng hợp') ws.autoFilter={from:{row:4,column:1},to:{row:4+sd.rows.length,column:n}};
  });
  return wb.xlsx.writeBuffer();
}

const RENDER={home:renderHome,tasks:renderTasks,meet:renderMeet,report:renderReport,staff:renderStaff,acc:renderAcc};
document.addEventListener('click',e=>{
  if(e.target.id==='ov'){ closeModal(); return; }
  if(e.target.id==='cfo'){ closeAsk(); return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ go(tb.dataset.tab); return; }
  const pr=e.target.closest('tr[data-row]'); if(pr&&!e.target.matches('input')){ const c=pr.querySelector('input'); c.checked=!c.checked; c.dispatchEvent(new Event('change',{bubbles:true})); return; }
  const el=e.target.closest('[data-act]'); if(!el) return; const a=el.dataset.act, id=el.dataset.id;
  if(!a) return;
  if(a==='open') openTask(id);
  else if(a==='close') closeModal();
  else if(a==='cfNo') closeAsk();
  else if(a==='cfYes'){ const f=CF; closeAsk(); if(f) f(); }
  else if(a==='remind') openRemind(id);
  else if(a==='give') openGive('');
  else if(a==='giveSubmit') submitGive();
  else if(a==='kpi'){ const v=el.dataset.v; if(v==='meet') go('meet'); else { F.late=v==='over'; go('tasks'); } }
  else if(a==='seg'){ const k=el.dataset.k, v=el.dataset.v;
    if(k==='tv'){ TV=v; pref.set('view',v); renderTasks(); } else if(k==='mv'){ MV=v; renderMeet(); } else if(k==='rv'){ RV=v; renderReport(); } }
  else if(a==='late'){ F.late=!F.late; renderTaskBody(); }
  else if(a==='clr'){ F.who='';F.kd='';F.late=false;F.q=''; FP.p='all'; FP.from=''; FP.to=''; renderTasks(); }
  else if(a==='toggle') act('setDone',[id,el.dataset.key,el.dataset.on==='1'],'Đã lưu.',()=>openTask(id));
  else if(a==='addLog'){ const v=$('#logInput').value.trim(); if(!v){ toast('Chưa nhập nội dung.','error'); return; } act('addLog',[id,v,$('#logFor').value||'',null],'Đã ghi lại.',()=>openTask(id)); }
  else if(a==='logRemind'){ const t=findTask(id), ks=t.who.filter(w=>!w.done); act('addLog',[id,'Đã nhắc: '+ks.map(aName).join(', ')+'.','',ks.map(aKey)],'Đã ghi vào nhật ký.',()=>openTask(id)); }
  else if(a==='copy'){ const ta=$('#remindTxt'); (navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('Đã sao chép lời nhắc.')).catch(()=>{ ta.select(); toast('Đã bôi đen, bấm Ctrl+C để sao chép.','info'); }); }
  else if(a==='editTask') openEditTask(id);
  else if(a==='saveTask') act('updateTask',[id,{title:$('#etTitle').value,src:$('#etSrc').value,due:$('#etDue').value}],'Đã lưu.',()=>openTask(id));
  else if(a==='delTask'){ const t=findTask(id); ask('Xóa việc này?','“'+t.title+'” cùng người nhận, giai đoạn và nhật ký sẽ bị xóa khỏi bảng tính. Không lấy lại được.','Xóa việc',()=>act('deleteTask',[id],'Đã xóa việc.',()=>closeModal())); }
  else if(a==='addStage') addStage();
  else if(a==='delStage') el.parentElement.remove();
  else if(a==='delWho'){ PICK.splice(+el.dataset.i,1); renderWho(); }
  else if(a==='pickNone'){ PICK=[]; renderWho(); }
  else if(a==='pickTeam'){ setWho('t:'+id,!has('t',id)); renderWho(); }
  else if(a==='pickSug'){ SUGI=+el.dataset.i; const p=SUG[SUGI]; if(p){ setWho('p:'+p.id,true); $('#fName').value=''; SUG=[]; renderWho(); $('#fName').focus(); } }
  else if(a==='addName') addName();
  else if(a==='editMeet'){ if(ADM()) openMeet(id); }
  else if(a==='saveMeet') act('saveMeet',[{id:id||'',d:$('#m_d').value,t:$('#m_t').value,name:$('#m_name').value,place:$('#m_place').value,chair:$('#m_chair').value,who:$('#m_who').value,prep:$('#m_prep').value}],'Đã lưu cuộc họp.',()=>closeModal());
  else if(a==='delMeet'){ const m=MEETS.find(x=>x.id===id); ask('Xóa cuộc họp này?','“'+m.name+'” ngày '+fmtY(m.d)+' sẽ bị xóa khỏi lịch.','Xóa cuộc họp',()=>act('deleteMeet',[id],'Đã xóa cuộc họp.',()=>closeModal())); }
  else if(a==='fromMeet'){ const m=MEETS.find(x=>x.id===id); openGive('Kết luận '+m.name+' ngày '+fmtY(m.d)); }
  else if(a==='export') doExport();
  else if(a==='exportDrive') exportDrive();
  else if(a==='editStaff') openStaff(id);
  else if(a==='saveStaff') saveStaff(id);
  else if(a==='editAcc') openAcc(id);
  else if(a==='saveAcc') accCall('saveAccount',[{u:id||$('#acU').value.trim(),name:$('#acN').value.trim(),role:$('#acR').value,active:$('#acA').checked},!id],id?'Đã lưu tài khoản.':'Đã thêm tài khoản.');
  else if(a==='resetPw') ask('Đặt lại mật khẩu?','Mật khẩu của “'+id+'” sẽ trở về mật khẩu mặc định. Người đó cần đổi lại sau khi đăng nhập.','Đặt lại',()=>accCall('resetPassword',[id],'Đã đặt lại về mật khẩu mặc định.'));
  else if(a==='tgOpen') openTg();
  else if(a==='tgConnect') tgCall('tgConnect',[$('#tgTok').value.trim(),location.href],'Đã kết nối. Mở Telegram xem bản tin thử.');
  else if(a==='tgTest') tgCall('tgTest',[],'Đã gửi bản tin vào Telegram.');
  else if(a==='tgOff') ask('Tắt nhắc qua Telegram?','Bot sẽ không gửi bản tin buổi sáng nữa. Muốn bật lại thì cài đặt lại.','Tắt',()=>tgCall('tgOff',[],'Đã tắt nhắc qua Telegram.'));
  else if(a==='pwOpen') openPw();
  else if(a==='pwSave'){
    const n1=$('#pwNew').value, n2=$('#pwNew2').value, err=m=>{ $('#pwErr').textContent=m; $('#pwErr').hidden=false; };
    if(n1.length<6) return err('Mật khẩu mới cần ít nhất 6 ký tự.');
    if(n1!==n2) return err('Hai lần nhập mật khẩu mới chưa khớp.');
    act('changePassword',[$('#pwOld').value,n1],'Đã đổi mật khẩu.',()=>closeModal());
  }
  else if(a==='logout'){ const t=TOKEN; showLogin(''); if(t) api('logout',t).catch(()=>{}); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act2==='stage'){ act('setStage',[el.dataset.id,+el.dataset.n,el.checked],'Đã lưu.',()=>openTask(el.dataset.id)); return; }
  if(el.id==='fwho'){ F.who=el.value; renderTaskBody(); }
  const pm=/^(tper|rper)([pbft])$/.exec(el.id||'');
  if(pm){ if(pm[1]==='tper'){ setPer(FP,pm[2],el.value); if(pm[2]==='p') renderTasks(); else renderTaskBody(); } else { setPer(RPP,pm[2],el.value); renderReport(); } return; }
  if(el.id==='fkd'){ F.kd=el.value; renderTaskBody(); }
  if(el.id==='rf'){ RF=el.value; renderReport(); }
  if(el.id==='sTm'){ SF.tm=el.value; renderStaffBody(); }
  if(el.id==='sfRole') $('#sfTeamLbl').textContent=el.value==='Phó phường'?'Phụ trách tổ':'Thuộc tổ';
  if(el.id==='fKind'){ const st=el.value==='stage'; $('#fKindHint').textContent=KHINT[el.value]; $('#fStagesBox').hidden=!st; if(st&&!$('#fStages').children.length){ addStage('Giai đoạn 1',''); addStage('Giai đoạn 2',''); } }
});
document.addEventListener('input',e=>{
  if(e.target.id==='fq'){ F.q=e.target.value; renderTaskBody(); }
  if(e.target.id==='rq'){ RQ=e.target.value; const pos=e.target.selectionStart; renderReport(); const n=$('#rq'); if(n){ n.focus(); try{ n.setSelectionRange(pos,pos); }catch(_){} } }
  if(e.target.id==='sQ'){ SF.q=e.target.value; renderStaffBody(); }
  if(e.target.id==='fName'){ SUGI=0; renderSug(); }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ if(!$('#cfo').hidden) closeAsk(); else if(!$('#ov').hidden) closeModal(); return; }
  if(e.target.id==='fName'&&SUG.length&&(e.key==='ArrowDown'||e.key==='ArrowUp')){ e.preventDefault(); SUGI=(SUGI+(e.key==='ArrowDown'?1:SUG.length-1))%SUG.length; renderSug(); return; }
  if(e.key==='Enter'&&e.target.id==='fName'){ e.preventDefault(); addName(); return; }
  if(e.key==='Enter'&&e.target.closest('#giveForm')&&e.target.tagName==='INPUT'){ e.preventDefault(); return; }
  if(e.key==='Enter'&&e.target.matches('[data-act=open]')&&e.target.tagName!=='BUTTON'){ openTask(e.target.dataset.id); return; }
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&e.target.id==='logInput'){ e.preventDefault(); const b=document.querySelector('[data-act=addLog]'); if(b) b.click(); }
});

/* ================= Khởi động ================= */
document.querySelectorAll('[data-logo]').forEach(e=>e.innerHTML=ic('clip',e.closest('.sm')?17:20));
$('#lgLogo').innerHTML=ic('clip',32);
document.querySelectorAll('[data-ic]').forEach(e=>e.innerHTML=ic(e.dataset.ic,e.classList.contains('ibtn')?18:16));
(async function boot(){
  TOKEN=store.get();
  if(!TOKEN) return showLogin('');
  try{ setData(await api('getData',TOKEN)); showApp(); }
  catch(e){ showLogin(expired(e)?'':errMsg(e)); }
})();
</script>
</body>
</html>
